name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -q GTA6Prank.zip
      - run: gradle assembleDebug
        working-directory: GTA6Prank
      - uses: actions/upload-artifact@v4
        with:
          name: GTA-VI-APK
          path: GTA6Prank/app/build/outputs/apk/debug/app-debug.apk
